<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akwa Ibom Malaria Habitat Suitability and Risk Maps</title>
<style>
:root{--ink:#1d2a33;--muted:#5d6b75;--line:#dde3e8;--bg:#f5f7f9;--card:#fff;--accent:#0b6e4f;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#0f2a37;color:#fff;padding:14px 20px}
header h1{margin:0;font-size:20px}
header p{margin:2px 0 8px;color:#b9cad4;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#1d4254;border-radius:12px;padding:2px 10px;font-size:12px}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 20px 0;background:#fff;border-bottom:1px solid var(--line)}
nav button{border:0;background:none;padding:10px 14px;font:inherit;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--accent);border-color:var(--accent);font-weight:600}
main{padding:16px 20px;max-width:1300px;margin:0 auto}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}header,main,nav{padding-left:12px;padding-right:12px}}
.scroll,.card{overflow-x:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px}
.card h2{margin:0 0 6px;font-size:16px}
.card h3{margin:14px 0 4px;font-size:14px}
.hint{color:var(--muted);font-size:13px;margin:4px 0}
.notice{background:#fff8e6;border:1px solid #f1d38a;border-radius:6px;padding:8px 10px;font-size:13px;margin:8px 0}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:100%}
svg{width:100%;height:auto;display:block}
.lga{stroke:#fff;stroke-width:.4;cursor:pointer}
.lga:hover,.lga.sel{stroke:#000;stroke-width:1.2}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:6px}
.ramp{height:10px;flex:1;max-width:240px;border-radius:5px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.row{cursor:pointer}tr.row:hover,tr.row.sel{background:#eef6f2}
.bar{display:inline-block;height:8px;background:var(--accent);border-radius:4px;vertical-align:middle}
.scroll{max-height:520px;overflow:auto}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:6px 0;font-size:13px}
dt{color:var(--muted)}dd{margin:0;text-align:right}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#fde8d0;color:#8a4a00}
.q{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.method p,.method li{max-width:80ch}
code{background:#eef1f4;padding:1px 5px;border-radius:4px;font-size:12.5px}
footer{padding:16px 20px;color:var(--muted);font-size:12px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Akwa Ibom malaria habitat suitability and risk maps</h1>
  <p>Where conditions favour Anopheles habitat, where malaria is observed, and who can reach care.</p>
  <div class="chips" id="chips"></div>
</header>
<nav role="tablist" id="tabs">
  <button role="tab" data-t="suit" aria-selected="true">Habitat suitability</button>
  <button role="tab" data-t="burden" aria-selected="false">Observed burden (2023)</button>
  <button role="tab" data-t="access" aria-selected="false">Health-facility access</button>
  <button role="tab" data-t="plan" aria-selected="false">Planning view</button>
  <button role="tab" data-t="method" aria-selected="false">Method and data</button>
</nav>
<main>
  <div id="view-map">
    <div class="grid">
      <section class="card">
        <h2 id="mapTitle"></h2>
        <p class="hint" id="mapDesc"></p>
        <div class="controls">
          <label>Show <select id="metric"></select></label>
          <label><input type="checkbox" id="showFac"> Health facilities</label>
        </div>
        <div id="notice"></div>
        <svg id="map" viewBox="0 0 100 100" role="img" aria-label="Map of Akwa Ibom local government areas"></svg>
        <div class="legend" id="legend"></div>
      </section>
      <div>
        <section class="card" id="detail"></section>
        <section class="card">
          <h2>LGA ranking</h2>
          <div class="scroll"><table id="rank"></table></div>
        </section>
      </div>
    </div>
    <section class="card" id="extra" hidden></section>
  </div>
  <section class="card method" id="view-method" hidden></section>
</main>
<footer>Suitability describes habitat conditions, not disease risk. Observed burden is facility-reported and approximate. See Method and data.</footer>

<script>
(async function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(v,d=0)=>v==null||isNaN(v)?'n/a':Number(v).toLocaleString('en',{maximumFractionDigits:d,minimumFractionDigits:d});
const pct=(v,d=0)=>v==null?'n/a':fmt(v*100,d)+'%';
const getJSON=async u=>{try{const r=await fetch(u,{cache:'no-cache'});return r.ok?await r.json():null}catch(_){return null}};

const [B,GEO,S]=await Promise.all([
  getJSON('data/akwa_ibom_burden.json'),
  getJSON('data/akwa_ibom_lga_malaria_2023.geojson'),
  getJSON('data/akwa_ibom_suitability.json')]);
if(!B||!GEO){$('main').innerHTML='<div class="card">Could not load data/akwa_ibom_burden.json or the LGA boundaries.</div>';return}

const LAYERS={rainfall:'Rainfall',temperature:'Temperature',ndvi:'NDVI (vegetation)',surface_water:'Surface water',twi:'Topographic wetness (TWI)'};
const LKEYS=Object.keys(LAYERS);
const byCode={};
B.rows.forEach(r=>byCode[r.pcode]={b:r,s:null,name:r.name});
if(S)S.rows.forEach(r=>{if(byCode[r.pcode])byCode[r.pcode].s=r});
const ROWS=Object.values(byCode);
const popOf=d=>d.s?d.s.pop_total:null;
const beyondShare=d=>d.s&&d.s.pop_total?d.s.access.pop_beyond/d.s.pop_total:null;

// metric registry: value, format, which tab it belongs to
const M={
 suit:{tab:'suit',label:'Combined suitability (5 layers, equal weights)',f:d=>d.s?.suit,fmt:v=>fmt(v,2),need:'s',lo:'Lower suitability',hi:'Higher suitability'},
 ...Object.fromEntries(LKEYS.map((k,i)=>['l_'+k,{tab:'suit',label:LAYERS[k]+' score',f:d=>d.s?.s[i],fmt:v=>fmt(v,2),need:'s',lo:'Lower score',hi:'Higher score'}])),
 tpr:{tab:'burden',label:'RDT test positivity, all ages',f:d=>d.b.tpr,fmt:v=>pct(v,1),lo:'Lower positivity',hi:'Higher positivity'},
 tpr_u5:{tab:'burden',label:'RDT test positivity, under 5',f:d=>d.b.tpr_u5,fmt:v=>pct(v,1),lo:'Lower positivity',hi:'Higher positivity'},
 tpr_o5:{tab:'burden',label:'RDT test positivity, 5 and over',f:d=>d.b.tpr_o5,fmt:v=>pct(v,1),lo:'Lower positivity',hi:'Higher positivity'},
 unc1k:{tab:'burden',label:'Uncomplicated cases per 1,000 people (approx.)',f:d=>popOf(d)?d.b.unc/popOf(d)*1000:null,fmt:v=>fmt(v,0),need:'s',lo:'Fewer',hi:'More'},
 beyond:{tab:'access',label:'Population living beyond the distance threshold',f:beyondShare,fmt:v=>pct(v,0),need:'s',lo:'Better access',hi:'Poorer access'},
 dist:{tab:'access',label:'Population-weighted distance to nearest facility (km)',f:d=>d.s?.access.pop_weighted_dist_km,fmt:v=>fmt(v,1),need:'s',lo:'Closer',hi:'Farther'},
 fac100:{tab:'access',label:'Facilities per 100 km²',f:d=>d.b.fac_per_100km2,fmt:v=>fmt(v,1),inv:true,lo:'More facilities',hi:'Fewer facilities'},
 fac10k:{tab:'access',label:'Facilities per 10,000 people (approx.)',f:d=>popOf(d)?d.b.fac.total/popOf(d)*1e4:null,fmt:v=>fmt(v,1),need:'s',inv:true,lo:'More facilities',hi:'Fewer facilities'},
 plan:{tab:'plan',label:'Suitability and access classes',f:null}
};
const TABS={
 suit:{title:'Habitat suitability',desc:'How well local conditions support Anopheles habitat, from rainfall, temperature, NDVI, surface water and topographic wetness (equal weights, provisional). This is not a disease-risk map.',def:'suit'},
 burden:{title:'Observed malaria burden, 2023',desc:'RDT test positivity from Ministry of Health facility reports: positives divided by fever patients tested by RDT. Independent of the suitability model.',def:'tpr'},
 access:{title:'Health-facility access',desc:'GRID3 health facilities and the population living beyond the distance threshold. Access is reported separately and never enters the suitability score.',def:'beyond'},
 plan:{title:'Planning view',desc:'Suitability against access: where habitat is favourable and people are far from care.',def:'plan'}
};
let tab='suit',metric='suit',sel=null;

// ---- map geometry (equirectangular with cos(lat) correction)
const feats=GEO.features;
let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
const rings=g=>g.type==='Polygon'?[g.coordinates]:g.coordinates;
feats.forEach(f=>rings(f.geometry).forEach(p=>p[0].forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)})));
const k=Math.cos((y0+y1)/2*Math.PI/180),W=100,H=(y1-y0)/((x1-x0)*k)*W;
const px=x=>(x-x0)*k/((x1-x0)*k)*W,py=y=>(y1-y)/(y1-y0)*H;
const pathOf=g=>rings(g).map(p=>p.map(r=>'M'+r.map(([x,y])=>px(x).toFixed(2)+' '+py(y).toFixed(2)).join('L')+'Z').join('')).join('');
$('#map').setAttribute('viewBox',`0 0 ${W} ${H.toFixed(1)}`);

// ---- colour ramp
const STOPS=[[255,247,188],[254,196,79],[217,95,14],[127,39,4]];
const ramp=t=>{t=Math.max(0,Math.min(1,t));const s=t*(STOPS.length-1),i=Math.min(Math.floor(s),STOPS.length-2),u=s-i;
 return 'rgb('+STOPS[i].map((c,j)=>Math.round(c+(STOPS[i+1][j]-c)*u)).join(',')+')'};
const QCOL={hh:'#b91c1c',hl:'#f59e0b',lh:'#60a5fa',ll:'#d1d5db'};
const QNAME={hh:'High suitability, poor access',hl:'High suitability, good access',lh:'Lower suitability, poor access',ll:'Lower suitability, good access'};
const median=a=>{a=a.filter(v=>v!=null).sort((x,y)=>x-y);return a.length?(a[a.length>>1]+a[(a.length-1)>>1])/2:null};
function quad(d,ms,mb){const s=d.s?.suit,b=beyondShare(d);if(s==null||b==null)return null;return (s>=ms?'h':'l')+(b>=mb?'h':'l')}

function draw(){
  const m=M[metric],t=TABS[tab];
  $('#mapTitle').textContent=t.title;$('#mapDesc').textContent=t.desc;
  const avail=m.need==='s'?!!S:true;
  $('#notice').innerHTML=avail?'':'<div class="notice">Suitability and population data are not built yet. Run the <b>Refresh Earth Engine data</b> workflow (or <code>python scripts/build_data.py</code>) to create <code>data/akwa_ibom_suitability.json</code>. Burden and facility counts are already available.</div>';
  let vals=ROWS.map(d=>m.f?m.f(d):null),mn=0,mx=1,ms,mb;
  if(metric==='plan'){ms=median(ROWS.map(d=>d.s?.suit));mb=median(ROWS.map(beyondShare))}
  else{const v=vals.filter(x=>x!=null);mn=Math.min(...v);mx=Math.max(...v)}
  const colour=d=>{
    if(metric==='plan'){const q=quad(d,ms,mb);return q?QCOL[q]:'#e5e7eb'}
    let v=m.f(d);if(v==null||!isFinite(mn))return '#e5e7eb';
    let tt=mx>mn?(v-mn)/(mx-mn):0.5;return ramp(m.inv?1-tt:tt)};
  const svg=feats.map(f=>{const d=byCode[f.properties.adm2_pcode];
    return `<path class="lga${sel===d.b.pcode?' sel':''}" data-c="${esc(d.b.pcode)}" d="${pathOf(f.geometry)}" fill="${colour(d)}"><title>${esc(d.name)}${m.f?': '+m.fmt(m.f(d)):''}</title></path>`}).join('');
  const dots=$('#showFac').checked?B.facilities.map(([x,y,l])=>`<circle cx="${px(x).toFixed(2)}" cy="${py(y).toFixed(2)}" r="${l===2?.9:l===1?.6:.35}" fill="${l===2?'#111':l===1?'#1d4ed8':'#0b6e4f'}" fill-opacity=".8" pointer-events="none"/>`).join(''):'';
  $('#map').innerHTML=svg+dots;
  $('#map').querySelectorAll('.lga').forEach(p=>p.onclick=()=>{sel=p.dataset.c;draw()});
  // legend
  if(metric==='plan'){
    $('#legend').innerHTML=Object.keys(QNAME).map(q=>`<span><span class="q" style="background:${QCOL[q]}"></span>${QNAME[q]}</span>`).join(' ')+(S?'':'');
  }else{
    const lo=m.inv?mx:mn,hi=m.inv?mn:mx;
    $('#legend').innerHTML=`<span>${m.lo}${isFinite(lo)?' ('+m.fmt(lo)+')':''}</span><div class="ramp" style="background:linear-gradient(90deg,${ramp(0)},${ramp(.33)},${ramp(.66)},${ramp(1)})"></div><span>${m.hi}${isFinite(hi)?' ('+m.fmt(hi)+')':''}</span>`;
  }
  if($('#showFac').checked)$('#legend').innerHTML+=' <span><span class="q" style="background:#0b6e4f"></span>primary <span class="q" style="background:#1d4ed8"></span>secondary <span class="q" style="background:#111"></span>tertiary</span>';
  // ranking
  const list=ROWS.map((d,i)=>({d,v:metric==='plan'?null:vals[i],q:metric==='plan'?quad(d,ms,mb):null}));
  if(metric==='plan')list.sort((a,b)=>(a.q==='hh'?0:1)-(b.q==='hh'?0:1)||(b.d.s?.suit??0)-(a.d.s?.suit??0));
  else{const key=x=>x.v==null?null:(m.inv?-x.v:x.v);
    list.sort((a,b)=>key(a)==null?(key(b)==null?0:1):key(b)==null?-1:key(b)-key(a))}
  const maxv=Math.max(...list.map(x=>x.v??0))||1;
  $('#rank').innerHTML='<tr><th>#</th><th>LGA</th><th class="n">'+(metric==='plan'?'Class':'Value')+'</th></tr>'+
    list.map((x,i)=>`<tr class="row${sel===x.d.b.pcode?' sel':''}" data-c="${esc(x.d.b.pcode)}"><td>${i+1}</td><td>${esc(x.d.name)}</td><td class="n">${metric==='plan'?(x.q?`<span class="q" style="background:${QCOL[x.q]}"></span>${QNAME[x.q]}`:'n/a'):m.fmt(x.v)+(x.v!=null&&!m.inv&&maxv>0?` <span class="bar" style="width:${Math.round(40*x.v/maxv)}px"></span>`:'')}</td></tr>`).join('');
  $('#rank').querySelectorAll('.row').forEach(r=>r.onclick=()=>{sel=r.dataset.c;draw()});
  detail();extra(ms,mb);
}

function detail(){
  const el=$('#detail');
  if(!sel){el.innerHTML='<h2>Select an LGA</h2><p class="hint">Click an area on the map or a row in the ranking.</p>';return}
  const d=byCode[sel],b=d.b,s=d.s;
  const row=(a,v)=>`<dt>${a}</dt><dd>${v}</dd>`;
  el.innerHTML=`<h2>${esc(d.name)}</h2>
  <h3>Habitat suitability</h3>${s?`<dl>${row('Combined score (0 to 1)',fmt(s.suit,2))}${LKEYS.map((k,i)=>row(LAYERS[k]+' score',fmt(s.s[i],2))).join('')}
   ${row('Rainfall',fmt(s.raw.rainfall_mm)+' mm/yr')}${row('Land surface temperature',fmt(s.raw.temperature_c,1)+' °C')}${row('NDVI',fmt(s.raw.ndvi,2))}${row('Surface-water occurrence',fmt(s.raw.water_occurrence_pct,1)+'%')}</dl>`:'<p class="hint">Not built yet.</p>'}
  <h3>Observed burden, 2023</h3><dl>${row('RDT positivity, all ages',pct(b.tpr,1))}${row('Under 5',pct(b.tpr_u5,1))}${row('5 and over',pct(b.tpr_o5,1))}
   ${row('Tested by RDT / positive',fmt(b.tested)+' / '+fmt(b.pos))}${row('Uncomplicated cases',fmt(b.unc))}</dl>
   ${b.flags.length?'<p><span class="tag">Data check</span> <span class="hint">RDT positives and uncomplicated cases differ by more than 20%.</span></p>':''}
  <h3>Health-facility access</h3><dl>${row('Facilities (GRID3)',fmt(b.fac.total)+` (${b.fac.primary} primary, ${b.fac.secondary} secondary, ${b.fac.tertiary} tertiary)`)}${row('Facilities per 100 km²',fmt(b.fac_per_100km2,1))}
   ${s?row('Population-weighted distance',fmt(s.access.pop_weighted_dist_km,1)+' km')+row('People beyond '+S.access_threshold_km+' km',fmt(s.access.pop_beyond)+' ('+pct(beyondShare(d))+')')+row('Population (WorldPop 2020)',fmt(s.pop_total)):''}</dl>`;
}

function extra(ms,mb){
  const el=$('#extra');
  if(tab!=='plan'&&tab!=='burden'){el.hidden=true;return}
  el.hidden=false;
  if(tab==='plan'){
    if(!S){el.innerHTML='<h2>Priority areas</h2><p class="hint">Needs the suitability build.</p>';return}
    const pri=ROWS.filter(d=>quad(d,ms,mb)==='hh').sort((a,c)=>c.s.suit-a.s.suit);
    el.innerHTML=`<h2>Priority areas: high suitability and poor access</h2>
    <p class="hint">Cut-offs are the state medians (suitability ${fmt(ms,2)}, share beyond ${S.access_threshold_km} km ${pct(mb)}). These are relative classes, not absolute thresholds.</p>
    <table><tr><th>LGA</th><th class="n">Suitability</th><th class="n">People beyond ${S.access_threshold_km} km</th><th class="n">RDT positivity</th></tr>${pri.map(d=>`<tr><td>${esc(d.name)}</td><td class="n">${fmt(d.s.suit,2)}</td><td class="n">${fmt(d.s.access.pop_beyond)}</td><td class="n">${pct(d.b.tpr,0)}</td></tr>`).join('')||'<tr><td colspan="4">None</td></tr>'}</table>`;
  }else{
    const rho=S?spearman(ROWS.map(d=>d.s?.suit),ROWS.map(d=>d.b.tpr)):null;
    el.innerHTML=`<h2>Does suitability line up with observed burden?</h2>
    <p class="hint">${rho==null?'Needs the suitability build.':`Spearman correlation between combined suitability and RDT positivity across 31 LGAs: <b>${fmt(rho,2)}</b>. With 31 areas, facility-reported data and a provisional model, treat this as indicative only.`}</p>`;
  }
}
function rank(a){const idx=a.map((v,i)=>[v,i]).sort((x,y)=>x[0]-y[0]),r=[];idx.forEach(([,i],j)=>r[i]=j+1);return r}
function spearman(a,b){const p=a.map((v,i)=>[v,b[i]]).filter(([x,y])=>x!=null&&y!=null);if(p.length<5)return null;
  const ra=rank(p.map(x=>x[0])),rb=rank(p.map(x=>x[1])),n=p.length,ma=ra.reduce((s,v)=>s+v)/n,mb=rb.reduce((s,v)=>s+v)/n;
  let c=0,va=0,vb=0;for(let i=0;i<n;i++){c+=(ra[i]-ma)*(rb[i]-mb);va+=(ra[i]-ma)**2;vb+=(rb[i]-mb)**2}return c/Math.sqrt(va*vb)}

function setMetricOptions(){
  const opts=Object.entries(M).filter(([,m])=>m.tab===tab);
  $('#metric').innerHTML=opts.map(([id,m])=>`<option value="${id}">${esc(m.label)}</option>`).join('');
  $('#metric').parentElement.hidden=opts.length<2;
  metric=TABS[tab].def;$('#metric').value=metric;
}
function showTab(t){
  tab=t;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
  const isM=t==='method';
  $('#view-map').hidden=isM;$('#view-method').hidden=!isM;
  if(isM){method();return}
  setMetricOptions();draw();
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
$('#metric').onchange=e=>{metric=e.target.value;draw()};
$('#showFac').onchange=draw;

$('#chips').innerHTML=[
 `Cases: ${B.year} (Ministry of Health)`,
 S?`Suitability layers: ${S.year}`:'Suitability: not built yet',
 S?`Population: WorldPop ${S.population_year}`:'',
 `Facilities: GRID3 v2.0 (NHFR 2024), ${B.facilities.length}`,
 S?`Built ${S.generated.slice(0,10)}`:''].filter(Boolean).map(c=>`<span class="chip">${esc(c)}</span>`).join('');

function method(){
  const flags=B.rows.filter(r=>r.flags.length).map(r=>esc(r.name)).join(', ')||'none';
  $('#view-method').innerHTML=`<h2>Method and data</h2>
  <h3>1. Habitat suitability (the main map)</h3>
  <p>Five layers are scored 0 to 1 (1 = most suitable for Anopheles habitat) and combined with <b>equal weights of 20% each</b>. The weights are provisional and chosen for transparency, not fitted to the case data.</p>
  <ul>
   <li><b>Rainfall</b>: CHIRPS annual total, scaled between the state 2nd and 98th percentiles; more rain scores higher.</li>
   <li><b>Temperature</b>: MODIS daytime land-surface temperature, scored with a thermal-suitability curve that peaks near 25 °C and falls to zero at about 16 °C and 34 °C (Mordecai et al., 2013).</li>
   <li><b>NDVI</b>: MODIS MOD13Q1 annual mean, scaled between the 2nd and 98th percentiles; greener scores higher.</li>
   <li><b>Surface water</b>: JRC Global Surface Water. Score falls linearly with distance to water (occurrence of 10% or more) up to 5 km. Permanent water bodies (50% or more) are masked out.</li>
   <li><b>Topographic wetness (TWI)</b>: derived from MERIT Hydro; wetter terrain scores higher.</li>
  </ul>
  <p>Classes (low, moderate, high) are equal thirds of the state's 2nd to 98th percentile suitability range. They are relative, not absolute.</p>
  <h3>2. Observed burden</h3>
  <p><b>RDT test positivity</b> = persons testing positive by RDT ÷ fever patients tested by RDT, 2023, Ministry of Health, Akwa Ibom State. Age groups are combined by summing counts. Uncomplicated cases per 1,000 uses WorldPop 2020 and is approximate. Severe, clinically diagnosed and microscopy columns are not used because they are incomplete or overlap with RDT results.</p>
  <p>LGAs where RDT positives and uncomplicated cases differ by more than 20%: ${flags}.</p>
  <h3>3. Health-facility access</h3>
  <p>GRID3 Nigeria health facilities v2.0 (NHFR 2024), all levels, assigned to LGAs by location. Distances are straight-line (no road network). The population beyond ${S?S.access_threshold_km:5} km uses WorldPop 2020.</p>
  <h3>4. Limits to keep in mind</h3>
  <ul>
   <li>Suitability is a habitat indicator. It is not a measure of infection or risk, and it ignores interventions, housing and behaviour.</li>
   <li>Case data are facility-reported. Under-reporting is likely where access is poor, so low burden there can mean missed cases.</li>
   <li>Layer years are ${S?S.year:2023} to match the case year; population is WorldPop 2020. Surface-water distance includes coastal and river water.</li>
   <li>Relationships in the equal-weight model (for example, that more rainfall always raises suitability) are simplifications to be reviewed with entomology experts.</li>
  </ul>
  <h3>5. Data files and rebuilding</h3>
  <p><code>data/akwa_ibom_burden.json</code> is built offline by <code>scripts/build_burden.py</code> from the cases CSV and GRID3 facilities. <code>data/akwa_ibom_suitability.json</code> is built by <code>scripts/build_data.py</code> using Earth Engine (the <i>Refresh Earth Engine data</i> workflow). Settings are in <code>config.json</code>.</p>`;
