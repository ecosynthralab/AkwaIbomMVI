name: Refresh Earth Engine data

on:
  workflow_dispatch:
  push:
    paths: ['weights.json', 'config.json', 'data/cases_2024.csv', 'scripts/build_data.py']
  schedule:
    - cron: '0 3 1 * *'   # monthly; the underlying layers are annual, so this is plenty

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install earthengine-api
      - name: Build data from Earth Engine
        env:
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_data.py
      - name: Commit refreshed data
        run: |
          git config user.name  "ee-data-bot"
          git config user.email "ee-data-bot@users.noreply.github.com"
          git add data/akwa_ibom_mvi.json data/akwa_ibom_lga.geojson
          git diff --cached --quiet || git commit -m "Refresh Earth Engine data"
          git push
